name: Publish HSR Warptracker

on:
  push:
    branches: [ "main" ]
    paths: 
      - 'web/backend/**'
      - 'web/frontend/**'
      - '.github/workflows/**'

  pull_request:
    branches: [ "main" ]
    paths:
      - 'web/backend/**'
      - 'web/frontend/**'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r web/backend/requirements.txt
      - name: Run Django Tests
        run: python web/backend/manage.py test

  build-and-push:
    if: github.event_name == 'push'
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to dockerhub
        uses: docker/login-action@v3
        with:
          username: haenck
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: web/backend
          file: web/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: haenck/hsr-warptracker-backend:latest
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: web/frontend
          file: web/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: haenck/hsr-warptracker-frontend:latest